<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chezz Motel" />
    <meta name="application-name" content="Chezz Motel" />
    <meta name="theme-color" content="#FBF9F2" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link id="manifest-link" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        var isEstela = window.location.pathname.toLowerCase().includes('estelaibarra147') || 
                       window.location.hash.toLowerCase().includes('estelaibarra147') ||
                       (localStorage.getItem('chezz_estela_authorized') === 'true' && (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone));
        
        var manifestLink = document.getElementById('manifest-link');
        if (manifestLink) {
          manifestLink.href = isEstela ? '/manifest-estela.json' : '/manifest.json';
        }

        var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (titleMeta) {
          titleMeta.setAttribute('content', isEstela ? 'Auditoría Chezz' : 'Panel Chezz');
        }
        var appNameMeta = document.querySelector('meta[name="application-name"]');
        if (appNameMeta) {
          appNameMeta.setAttribute('content', isEstela ? 'Auditoría Chezz' : 'Panel Chezz');
        }
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', isEstela ? '#FBF9F2' : '#211F1A');
        }
      })();

      // Captura del evento de instalación PWA para Android / Samsung
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        window.deferredInstallPrompt = e;
        console.log('[PWA] beforeinstallprompt listo para instalar');
        window.dispatchEvent(new CustomEvent('pwa-can-install'));
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <title>Panel de habitaciones - Chezz Motel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[PWA] ServiceWorker registrado:', reg.scope);
              reg.onupdatefound = () => {
                const installing = reg.installing;
                if (installing) {
                  installing.onstatechange = () => {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch(err => console.error('[PWA] Error en ServiceWorker:', err));
        });
      }

      // Recuperación automática si el navegador tenía en caché scripts antiguos
      window.addEventListener('error', (e) => {
        const msg = (e && e.message) || '';
        if (msg.includes('dynamically imported module') || msg.includes('Loading chunk') || msg.includes('Failed to fetch')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (const reg of regs) reg.unregister();
              caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
                window.location.reload();
              });
            });
          }
        }
      });
    </script>
  </body>
</html>
