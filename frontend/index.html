<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Control de turnos y auditoría IoT para las 18 habitaciones del motel" />
    <link rel="manifest" href="/manifest.json" />
    <title>Auditoría de Habitaciones</title>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] ServiceWorker registrado:', reg.scope))
            .catch(err => console.error('[PWA] Error en ServiceWorker:', err));
        });
      }
    </script>
  </body>
</html>
